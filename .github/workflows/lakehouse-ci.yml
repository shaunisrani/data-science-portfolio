name: Fab Yield Lakehouse CI

on:
  push:
    paths: ["projects/mlops/**", ".github/workflows/lakehouse-ci.yml"]
  pull_request:
    paths: ["projects/mlops/**", ".github/workflows/lakehouse-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mlops/fab-yield-lakehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: End-to-end pipeline test on real SECOM data
        run: python -m pytest -q tests
      - name: Validate Databricks bundle YAML
        run: python -c "import yaml; yaml.safe_load(open('databricks.yml'))"
